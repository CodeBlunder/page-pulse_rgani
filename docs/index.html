<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Pulse — URL Auditor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f2f7;
      color: #2d2d2d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    
    header {
      background: #0f1b33;
      color: #fff;
      padding: 32px 20px 28px;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header h1 span {
      color: #4e9af1;
    }

    header p {
      margin-top: 6px;
      color: #a0aec0;
      font-size: 0.95rem;
    }

    
    .container {
      max-width: 780px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
    }

    
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
    }

    .search-row input {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #dde2ed;
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
      transition: border-color 0.2s;
      outline: none;
    }

    .search-row input:focus {
      border-color: #4e9af1;
    }

    .search-row button {
      padding: 14px 26px;
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .search-row button:hover {
      background: #1a4a8a;
    }

    .search-row button:disabled {
      background: #8fa5c4;
      cursor: not-allowed;
    }

    
    #loader {
      display: none;
      text-align: center;
      color: #6b7a99;
      padding: 20px;
      font-size: 0.95rem;
    }

    
    .error-box {
      background: #fff5f5;
      border-left: 4px solid #e53e3e;
      border-radius: 8px;
      padding: 16px 20px;
      color: #c53030;
      font-size: 0.95rem;
    }

    
    .results-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }

    .card-header {
      background: #0f1b33;
      color: #fff;
      padding: 16px 24px;
      font-size: 0.85rem;
      color: #a0aec0;
      word-break: break-all;
    }

    .card-header strong {
      color: #fff;
      font-size: 1rem;
    }

    
    .metrics {
      padding: 8px 0;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 13px 24px;
      border-bottom: 1px solid #f3f4f8;
      gap: 16px;
    }

    .metric:last-child {
      border-bottom: none;
    }

    .metric-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-width: 160px;
      padding-top: 2px;
    }

    .metric-value {
      font-size: 0.97rem;
      color: #1a202c;
      text-align: right;
      word-break: break-word;
      max-width: 65%;
    }

    .metric-value.muted {
      color: #a0aec0;
      font-style: italic;
    }

    
    .seo-section {
      border-top: 2px solid #f0f2f7;
      padding: 24px;
    }

    .seo-section h3 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .score-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .score-circle.good    { background: #38a169; }
    .score-circle.needs   { background: #dd6b20; }
    .score-circle.poor    { background: #e53e3e; }

    .score-meta .grade {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .score-meta .grade.good  { color: #38a169; }
    .score-meta .grade.needs { color: #dd6b20; }
    .score-meta .grade.poor  { color: #e53e3e; }

    .score-meta .sub {
      font-size: 0.85rem;
      color: #a0aec0;
      margin-top: 2px;
    }

    .issues-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .issues-list li {
      font-size: 0.9rem;
      color: #4a5568;
      background: #fffbf0;
      border-left: 3px solid #dd6b20;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
    }

    .issues-list li.ok {
      background: #f0fff4;
      border-left-color: #38a169;
      color: #276749;
    }

    
    footer {
      text-align: center;
      padding: 28px 20px;
      color: #a0aec0;
      font-size: 0.82rem;
    }

    footer a {
      color: #4e9af1;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    
    @media (max-width: 520px) {
      .search-row { flex-direction: column; }
      .metric { flex-direction: column; gap: 4px; }
      .metric-value { text-align: left; max-width: 100%; }
      header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Page <span>Pulse</span></h1>
  <p>Paste any URL and get an instant SEO and structure report</p>
</header>

<div class="container">

  <div class="search-row">
    <input
      type="text"
      id="urlInput"
      placeholder="https://example.com"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="auditBtn" onclick="runAudit()">Audit</button>
  </div>

  <div id="loader">⏳ Fetching page data, hang on...</div>
  <div id="results"></div>

</div>

<footer>
  Built for <a href="https://digitalheroesco.com" target="_blank" rel="noopener">Digital Heroes Training Task</a>
</footer>

<script>
  
  const API_BASE = "https://page-pulse-rgani.onrender.com";

  function getScoreClass(grade) {
    if (grade === "Good") return "good";
    if (grade === "Needs Work") return "needs";
    return "poor";
  }

  function val(v, fallback = "—") {
    if (v === null || v === undefined || v === "") return `<span class="muted">${fallback}</span>`;
    return v;
  }

  async function runAudit() {
    const input = document.getElementById("urlInput");
    const resultsDiv = document.getElementById("results");
    const loader = document.getElementById("loader");
    const btn = document.getElementById("auditBtn");
    const url = input.value.trim();

    if (!url) {
      resultsDiv.innerHTML = `<div class="error-box">Enter a URL first — something like https://example.com</div>`;
      return;
    }

    
    resultsDiv.innerHTML = "";
    loader.style.display = "block";
    btn.disabled = true;
    btn.textContent = "Auditing...";

    try {
      const response = await fetch(`${API_BASE}/audit?url=${encodeURIComponent(url)}`);
      const data = await response.json();

      loader.style.display = "none";
      btn.disabled = false;
      btn.textContent = "Audit";

      if (data.error) {
        resultsDiv.innerHTML = `<div class="error-box">❌ ${data.error}</div>`;
        return;
      }

      const cls = getScoreClass(data.seo_grade);

      const issuesHTML = data.seo_issues.length > 0
        ? data.seo_issues.map(i => `<li>⚠ ${i}</li>`).join("")
        : `<li class="ok">✓ No major issues found</li>`;

      const statusBadge = data.http_status >= 200 && data.http_status < 300
        ? `${data.http_status} OK`
        : `${data.http_status}`;

      resultsDiv.innerHTML = `
        <div class="results-card">

          <div class="card-header">
            Audit results for <strong>${data.url}</strong>
          </div>

          <div class="metrics">
            <div class="metric">
              <span class="metric-label">HTTP Status</span>
              <span class="metric-value">${statusBadge}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Response Time</span>
              <span class="metric-value">${data.response_time_ms} ms</span>
            </div>
            <div class="metric">
              <span class="metric-label">Page Title</span>
              <span class="metric-value">${val(data.title, "none found")}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Meta Description</span>
              <span class="metric-value">${val(data.meta_description, "none found")}</span>
            </div>
            <div class="metric">
              <span class="metric-label">H1 Count</span>
              <span class="metric-value">${data.h1_count}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Images Missing Alt</span>
              <span class="metric-value">${data.images_missing_alt}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Word Count</span>
              <span class="metric-value">~${data.word_count.toLocaleString()} words</span>
            </div>
          </div>

          <div class="seo-section">
            <h3>SEO Score</h3>
            <div class="score-row">
              <div class="score-circle ${cls}">
                ${data.seo_score}
              </div>
              <div class="score-meta">
                <div class="grade ${cls}">${data.seo_grade}</div>
                <div class="sub">out of 100 — based on title, meta, H1, alt text, and content length</div>
              </div>
            </div>
            <ul class="issues-list">
              ${issuesHTML}
            </ul>
          </div>

        </div>
      `;

    } catch (err) {
      loader.style.display = "none";
      btn.disabled = false;
      btn.textContent = "Audit";
      resultsDiv.innerHTML = `<div class="error-box">❌ Could not connect to the server. Make sure the backend is running.</div>`;
    }
  }

  
  document.getElementById("urlInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") runAudit();
  });
</script>

</body>
</html>
